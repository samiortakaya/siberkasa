<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siber Kasa: Parola Yöneticisi</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        body { font-family: 'Nunito', sans-serif; background: linear-gradient(135deg, #fff0f5 0%, #ffe4e8 100%); color: #4a4a4a; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 40px 0; overflow-x: hidden; }
        .circles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; margin: 0; padding: 0; }
        .circles li { position: absolute; display: block; list-style: none; width: 20px; height: 20px; background: rgba(255, 182, 193, 0.5); animation: animate 25s linear infinite; bottom: -150px; border-radius: 50%; }
        .circles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .circles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .circles li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .circles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .circles li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        @keyframes animate { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-1000px) scale(1.5); opacity: 0; } }
        .container { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); padding: 35px 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(255, 182, 193, 0.5); width: 420px; z-index: 10; }
        .dashboard-container { width: 800px; display: flex; gap: 30px; }
        h2 { text-align: center; color: #d81b60; font-weight: 800; margin-top: 0; margin-bottom: 25px;}
        h3 { color: #ff758f; font-weight: 700; border-bottom: 2px solid #ffe4e8; padding-bottom: 10px; margin-top: 0;}
        label { font-size: 13px; color: #888; font-weight: 700; margin-left: 5px; display: block; }
        input { width: 100%; padding: 14px 15px; margin: 8px 0 18px 0; border: 2px solid #ffe4e8; border-radius: 12px; background-color: #fffafb; color: #555; box-sizing: border-box; transition: all 0.3s ease; font-size: 14px; font-family: 'Nunito', sans-serif; }
        input:focus { outline: none; border-color: #ff9a9e; background-color: #fff; box-shadow: 0 0 8px rgba(255, 154, 158, 0.3); }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #d81b60; border: none; border-radius: 14px; cursor: pointer; font-weight: 800; margin-top: 10px; font-size: 16px; font-family: 'Nunito', sans-serif; box-shadow: 0 4px 15px rgba(255, 154, 158, 0.5); transition: all 0.3s ease; }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 154, 158, 0.7); }
        .btn-save { background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%); color: #3d8c40; box-shadow: 0 4px 15px rgba(168, 230, 207, 0.5); }
        .btn-save:hover { box-shadow: 0 6px 20px rgba(168, 230, 207, 0.7); }
        .btn-logout { background: #ffe4e8; color: #d81b60; padding: 8px; width: auto; font-size: 12px; margin: 0; box-shadow: none; float: right;}
        #generatedPassword { font-size: 18px; text-align: center; color: #d81b60; font-weight: 800; letter-spacing: 1px; }
        .vault-item { background: #fffafb; border: 1px solid #ffe4e8; border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
        .vault-platform { font-weight: 800; color: #d81b60; font-size: 16px; }
        .vault-password { background: #ffe4e8; padding: 8px; border-radius: 8px; font-family: monospace; font-size: 14px; color: #333; text-align: center; font-weight: bold;}
        .empty-vault { text-align: center; color: #aaa; margin-top: 50px; font-size: 14px; font-weight: 600;}
        a { color: #d81b60; font-weight: bold; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<ul class="circles"><li></li><li></li><li></li><li></li><li></li></ul>

<!-- 1. KULLANICI GİRİŞ/KAYIT EKRANI -->
<div class="container" id="authScreen">
    
    <div id="loginForm">
        <h2>💖 Giriş Yap</h2>
        <label>E-Posta Adresiniz:</label>
        <input type="email" id="loginEmail" placeholder="ornek@mail.com">
        <label>Şifreniz (Ana Kilit):</label>
        <input type="password" id="loginPassword" placeholder="Hesap şifrenizi girin">
        <button onclick="login()">Giriş Yap 🔓</button>
        <p style="text-align:center; font-size:13px; margin-top:20px; color:#888;">
            Hesabınız yok mu? <a href="#" onclick="toggleAuthMode('register')">Buradan Kayıt Olun</a>
        </p>
    </div>

    <div id="registerForm" style="display:none;">
        <h2>✨ Yeni Hesap Aç</h2>
        <label>E-Posta Adresiniz:</label>
        <input type="email" id="regEmail" placeholder="ornek@mail.com">
        <label>Güçlü Bir Şifre Belirleyin:</label>
        <input type="password" id="regPassword" placeholder="Kasanızı kilitleyecek şifre">
        <label>Şifre Tekrar:</label>
        <input type="password" id="regPasswordConf" placeholder="Aynı şifreyi tekrar girin">
        <button onclick="requestRegistration()" id="btnRequestReg">Devam Et 📩</button>
        <p style="text-align:center; font-size:13px; margin-top:20px; color:#888;">
            Zaten hesabınız var mı? <a href="#" onclick="toggleAuthMode('login')">Giriş Yapın</a>
        </p>
    </div>

    <div id="otpForm" style="display:none;">
        <h2>📧 Gerçek E-Posta Doğrulaması</h2>
        <p style="text-align:center; font-size:13px; color:#888;">Mail adresinize 6 haneli BİR KOD GÖNDERİLDİ! Lütfen gelen kutunuzu (veya Spam'i) kontrol edip aşağıya girin.</p>
        <label style="text-align:center; font-size: 15px;">Doğrulama Kodu:</label>
        <input type="text" id="otpInput" placeholder="123456" maxlength="6" style="text-align: center; font-size: 24px; letter-spacing: 10px; font-weight: 800; color: #d81b60;">
        <button onclick="verifyOTP()" id="btnVerifyOtp">Doğrula ve Kaydı Tamamla ✅</button>
        <button onclick="toggleAuthMode('register')" style="background:transparent; color:#d81b60; box-shadow:none; border: 2px solid #ffe4e8; margin-top:15px;">İptal Et ve Geri Dön</button>
    </div>
</div>

<!-- 2. ANA YÖNETİM EKRANI (Başlangıçta Gizli) -->
<div class="container dashboard-container" id="dashboardScreen" style="display: none;">
    <div style="flex: 1; padding-right: 15px;">
        <h3>✨ Yeni Parola Üret</h3>
        <label>Platform (Örn: Instagram):</label>
        <input type="text" id="platform" placeholder="Hangi site/uygulama?">
        <label>Renk:</label>
        <input type="text" id="color" placeholder="Renk girin">
        <label>Unutmadığınız İsim:</label>
        <input type="text" id="name" placeholder="Bir isim girin">
        <label>Sayı:</label>
        <input type="number" id="number" placeholder="Sayı girin">

        <button onclick="generateCustomPassword()">Formülle Üret ✨</button>
        <input type="text" id="generatedPassword" readonly placeholder="Üretilen parola">
        <button class="btn-save" onclick="saveToVault()">KASAMA KAYDET 📥</button>
    </div>

    <div style="flex: 1; padding-left: 15px; border-left: 2px dashed #ffe4e8;">
        <button class="btn-logout" onclick="logout()">Kilitle ve Çık 🔒</button>
        <h3 id="userWelcomeTitle">Kayıtlı Parolalarım</h3>
        <div id="vaultList" style="max-height: 450px; overflow-y: auto; padding-right: 10px;"></div>
    </div>
</div>

<script>
    // PYTHON SUNUCUMUZUN ADRESİ (Artık aynı yerden yayınlanıyor)
    const API_URL = "";

    let currentUserEmail = ""; 
    let currentMasterKey = ""; 
    let vaultData = []; 
    let pendingEmail = "";
    let pendingPwd = "";

    function toggleAuthMode(mode) {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('otpForm').style.display = 'none';

        if (mode === 'register') {
            document.getElementById('registerForm').style.display = 'block';
        } else if (mode === 'login') {
            document.getElementById('loginForm').style.display = 'block';
        } else if (mode === 'otp') {
            document.getElementById('otpForm').style.display = 'block';
        }
    }

    async function requestRegistration() {
        const email = document.getElementById('regEmail').value.trim();
        const pwd = document.getElementById('regPassword').value;
        const pwdConf = document.getElementById('regPasswordConf').value;
        const btn = document.getElementById('btnRequestReg');
        
        if (!email || !pwd || !pwdConf) { alert("Tüm alanları doldurun!"); return; }
        if (pwd !== pwdConf) { alert("Şifreler birbirleriyle uyuşmuyor!"); return; }
        
        btn.innerText = "Kaydediliyor... ⏳";
        btn.disabled = true;
        
        try {
            const response = await fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: pwd })
            });
            const data = await response.json();
            
            if (data.success) {
                alert("Kayıt Başarılı! Şimdi giriş yapabilirsiniz.");
                document.getElementById('regEmail').value = "";
                document.getElementById('regPassword').value = "";
                document.getElementById('regPasswordConf').value = "";
                toggleAuthMode('login');
            } else {
                alert("Hata: " + data.message);
            }
        } catch (error) {
            alert("Sunucuya bağlanılamadı. VS Code üzerinden sunucu çalışıyor mu?");
        } finally {
            btn.innerText = "Devam Et 📩";
            btn.disabled = false;
        }
    }

    // GİRİŞ YAPMA (LOGIN)
    async function login() {
        const email = document.getElementById('loginEmail').value.trim();
        const pwd = document.getElementById('loginPassword').value;

        if (!email || !pwd) { alert("Lütfen E-posta ve şifrenizi girin!"); return; }

        try {
            const response = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: pwd })
            });
            const data = await response.json();

            if (data.success) {
                currentUserEmail = email;
                currentMasterKey = pwd; // Kasayı AES ile çözmek için
                document.getElementById('userWelcomeTitle').innerText = email.split('@')[0] + "'in Kasası";

                // Şifreli kasayı çöz
                if (data.encrypted_vault) {
                    try {
                        let bytes = CryptoJS.AES.decrypt(data.encrypted_vault, currentMasterKey);
                        vaultData = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
                    } catch(e) { 
                        vaultData = []; 
                    }
                } else {
                    vaultData = [];
                }

                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'flex';
                renderVault();
            } else {
                alert("Giriş Başarısız: " + data.message);
            }
        } catch (error) {
            alert("Sunucuya bağlanılamadı. Terminalde python server.py çalışıyor mu?");
        }
    }

    // KASAYI SUNUCUYA (SQLite) KAYDET
    async function saveVaultToStorage() {
        const dataStr = JSON.stringify(vaultData);
        // AES ile şifrele
        const encrypted = CryptoJS.AES.encrypt(dataStr, currentMasterKey).toString();
        
        try {
            await fetch(`${API_URL}/save_vault`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentUserEmail, encrypted_vault: encrypted })
            });
            renderVault();
        } catch (error) {
            alert("Kasa sunucuya kaydedilemedi!");
        }
    }

    function saveToVault() {
        const platform = document.getElementById('platform').value.trim();
        const password = document.getElementById('generatedPassword').value.trim();
        if(!platform || !password) { alert("Önce bir platform adı yazıp parola üretmelisiniz!"); return; }

        vaultData.push({ platform: platform, password: password });
        saveVaultToStorage();
        alert("Parola kasanıza kaydedildi ve veritabanına eşitlendi! ✅");
        
        document.getElementById('platform').value = "";
        document.getElementById('generatedPassword').value = "";
    }

    function renderVault() {
        const listDiv = document.getElementById('vaultList');
        listDiv.innerHTML = "";
        if(vaultData.length === 0) {
            listDiv.innerHTML = "<div class='empty-vault'>Kasanız şu an boş. Sol taraftan parola üretip kaydedebilirsiniz. 💖</div>"; return;
        }
        vaultData.forEach((item) => {
            listDiv.innerHTML += `
                <div class="vault-item">
                    <span class="vault-platform">${item.platform}</span>
                    <span class="vault-password">${item.password}</span>
                </div>
            `;
        });
    }

    function logout() {
        currentUserEmail = ""; currentMasterKey = ""; vaultData = []; 
        document.getElementById('loginPassword').value = "";
        document.getElementById('dashboardScreen').style.display = 'none';
        document.getElementById('authScreen').style.display = 'block';
    }

    function generateCustomPassword() {
        let platform = document.getElementById('platform').value.trim();
        let color = document.getElementById('color').value.trim();
        let name = document.getElementById('name').value.trim();
        let num = document.getElementById('number').value.trim();
        if (!platform || !color || !name || !num) { alert("Tüm alanları doldur!"); return; }

        let platPrefix = platform.substring(0, 3).toLowerCase();
        platPrefix = platPrefix.charAt(0).toUpperCase() + platPrefix.slice(1);
        let combinedWord = color + name;

        const leetMap = { 'a':'@','A':'@', 'e':'3','E':'3', 'i':'1','I':'1','ı':'1','İ':'1', 'o':'0','O':'0', 's':'$','S':'$', 'ş':'$','Ş':'$', 't':'7','T':'7' };
        let securePass = "";
        for (let i = 0; i < combinedWord.length; i++) {
            let char = combinedWord[i];
            if (leetMap[char] && Math.random() > 0.2) securePass += leetMap[char];
            else securePass += (Math.random() > 0.5) ? char.toUpperCase() : char.toLowerCase();
        }

        const symbols = "!#*?-+";
        let randomSym1 = symbols[Math.floor(Math.random() * symbols.length)];
        let randomSym2 = symbols[Math.floor(Math.random() * symbols.length)];
        let finalPassword = randomSym1 + platPrefix + "_" + securePass + num + randomSym2;
        document.getElementById('generatedPassword').value = finalPassword;
    }
</script>

</body>
</html>
